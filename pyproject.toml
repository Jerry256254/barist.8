[project]
name = "kuclab-barist4"
version = "1.0.0"
description = "Barist.8 - multilingual safety shield on a fine-tuned multilingual-e5-small encoder: binary safe/unsafe + 15 OpenAI-style categories, regex safety net, 3-state output."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "transformers>=4.45",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kuclab-cneser = "kuclab.cli:main"
"barist.7" = "kuclab.cli:ui_main"
"barist.8" = "kuclab.cli:ui_main_b8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
